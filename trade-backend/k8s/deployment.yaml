apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-backend
  template:
    metadata:
      labels:
        app: trade-backend
    spec:
      containers:
        - name: trade-backend
          image: trade-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: trade-backend
spec:
  selector:
    app: trade-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
